[package]
name = "argvus-greeter"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Lightweight GTK4 greetd greeter for the Argvus Desktop Environment"
repository = "https://github.com/argvus/argvus-greeter"

[dependencies]
anyhow = "1.0.100"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_12"] }
serde = { version = "1.0.228", features = ["derive"] }
shlex = "1.3.0"
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zbus = { version = "5.12.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
